<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafetería Mokafetería | Pedir en línea</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Custom CSS -->
  <link href="styles/index.css" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR PRINCIPAL (Color: rgb(241, 186, 131)) -->
  <nav class="navbar navbar-expand-lg brand-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-dark d-flex align-items-center" href="#">
        <i class="bi bi-cup-hot-fill me-2 fs-3 text-coffee"></i>
        <span>Mokafetería</span>
      </a>
      
      <!-- Búsqueda rápida -->
      <div class="d-flex flex-grow-1 mx-lg-4 mx-2">
        <div class="input-group">
          <span class="input-group-text search-icon"><i class="bi bi-search"></i></span>
          <input type="search" id="searchInput" class="form-control search-input" placeholder="Buscar en Mokafetería...">
        </div>
      </div>

      <!-- Carrito / Pedido -->
      <button class="btn btn-cart position-relative" data-bs-toggle="modal" data-bs-target="#cartModal">
        <i class="bi bi-cart3 me-1"></i> Carrito
        <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">
          0
        </span>
      </button>
    </div>
  </nav>

  <!-- BARRA DE CATEGORÍAS NAVEGABLE -->
  <div class="categories-bar border-bottom py-2 shadow-sm">
    <div class="container">
      <div class="category-scroll d-flex gap-2">
        <button class="btn btn-category active" data-category="todos">Todos</button>
        <button class="btn btn-category" data-category="cafes">Cafés Especiales</button>
        <button class="btn btn-category" data-category="reposteria">Repostería & Muffins</button>
        <button class="btn btn-category" data-category="desayunos">Desayunos & Brunch</button>
        <button class="btn btn-category" data-category="sandwiches">Sándwiches</button>
        <button class="btn btn-category" data-category="bebidas">Bebidas Frías</button>
      </div>
    </div>
  </div>

  <!-- TÍTULO Y PRESENTACIÓN -->
  <div class="container mt-4 text-center text-light">
    <h1 class="fw-bold display-5 brand-title">Mokafetería</h1>
    <p class="lead">El mejor sabor y aroma en cada taza, directo a tu mesa</p>
  </div>

  <!-- CONTENIDO PRINCIPAL: GRILLA DE PRODUCTOS RESPONSIVA -->
  <main class="container my-4">
    <div id="productsGrid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
      <!-- Los productos se cargan dinámicamente desde script.js -->
    </div>
  </main>

  <!-- MODAL CARRITO -->
  <div class="modal fade" id="cartModal" tabindex="-1" aria-labelledby="cartModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="cartModalLabel"><i class="bi bi-bag-check me-2"></i>Tu Pedido</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="cartItemsContainer">
            <p class="text-center text-muted py-4">Tu carrito está vacío</p>
          </div>
          <hr>
          <div class="d-flex justify-content-between align-items-center fw-bold fs-5">
            <span>Total:</span>
            <span id="cartTotal">$0</span>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Seguir comprando</button>
          <button type="button" id="checkoutBtn" class="btn btn-primary-custom" disabled>Confirmar Pedido</button>
        </div>
      </div>
    </div>
  </div>

  <!-- PIE DE PÁGINA -->
  <footer class="footer text-center py-4 border-top">
    <div class="container">
      <p class="mb-1 fw-semibold">&copy; 2026 Mokafetería. Todos los derechos reservados.</p>
      <small class="text-white-50">Disfruta de nuestros productos recién hechos con amor y calidad.</small>
    </div>
  </footer>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="script.js"></script>
</body>
</html>
