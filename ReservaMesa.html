<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva de Mesa</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Custom CSS -->
  <link href="styles/index.css" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR PRINCIPAL (Color: rgb(241, 186, 131)) -->
  <nav class="navbar navbar-expand-lg brand-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-dark d-flex align-items-center" href="index.html">
        <i class="bi bi-cup-hot-fill me-2 fs-3 text-coffee"></i>
        <span>Mokafetería</span>
      </a>

      <!--BOTON A "SOBRE NOSOTROS"-->
      <a href="SobreNosotros.html" class="text-dark text-decoration-none fw-bold me-3 d-none d-md-block">
        <i class="bi bi-people-fill me-1"></i>Sobre Nosotros
      </a>

        <!--BOTON A "CONTACTO"-->
      <a href="Contacto.html" class="text-dark text-decoration-none fw-bold me-3 d-none d-md-block">
        <i class="bi bi-envelope-fill me-1"></i>Contacto
      </a>
    </div>
  </nav>

  <!--UBICACION Y HORARIO DE ATENCION-->
  <div id="ubicacion-horario" class="text-center text-light py-4">
    <div class="container">
      <div class="row">
        <div class="col-12 col-md-6 mb-3 mb-md-0">
          <strong>Dirección:</strong>
          <p class="mt-2 text-dark">Av. Libertad 1254, Viña del Mar, Chile</p>
        </div>
        <div class="col-12 col-md-6">
          <strong>Horario</strong>
          <p class="mb-1 text-dark">08:00 - 22:00<br>Lunes a Domingo</p>
        </div>
      </div>
    </div>
  </div>

  <!--RESERVA DE MESAS-->
  <div id="reservas" class="text-center py-5">
    <div class="container">
      
      <h1 class="fw-bold display-5 brand-title mb-3">Reserva tu mesa</h1>
      
      <div class="row justify-content-center text-start">
        <div class="col-md-8 col-lg-6">
          
          <div id="reservaMensaje" class="alert d-none" role="alert"></div>

          <form id="reservaForm">
            <div class="mb-4">
              <label for="reservaFecha" class="form-label fw-semibold">Fecha</label>
              <input type="date" id="reservaFecha" class="form-control form-control-lg" required>
            </div>
            
            <div class="mb-4">
              <label for="reservaHora" class="form-label fw-semibold">Hora</label>
              <input type="time" id="reservaHora" class="form-control form-control-lg" required>
            </div>
            
            <div class="mb-5">
              <label for="reservaPersonas" class="form-label fw-semibold">Número de personas</label>
              <input type="number" id="reservaPersonas" class="form-control form-control-lg" min="1" max="20" placeholder="Ej: 2" required>
            </div>
            
            <button type="submit" class="btn btn-dark btn-lg w-100 fw-bold shadow-sm">Confirmar Reserva</button>
          </form>

        </div>
      </div>
      
    </div>
  </div>

</body>
</html>
